<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>WMS — Warehouse Management</title>
<style>
:root{--clr-primary:#2563eb;--clr-primary-dark:#1d4ed8;--clr-primary-light:#dbeafe;--clr-success:#16a34a;--clr-success-light:#dcfce7;--clr-warning:#f59e0b;--clr-warning-light:#fef3c7;--clr-danger:#dc2626;--clr-danger-light:#fee2e2;--clr-purple:#7c3aed;--clr-purple-light:#ede9fe;--clr-teal:#0d9488;--clr-orange:#ea580c;--clr-bg:#f1f5f9;--clr-surface:#fff;--clr-border:#e2e8f0;--clr-text:#0f172a;--clr-text-muted:#64748b;--clr-text-light:#94a3b8;--radius-sm:6px;--radius:10px;--radius-lg:16px;--radius-full:9999px;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);--font:'Segoe UI',system-ui,-apple-system,sans-serif;--transition:.2s ease;--header-h:60px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--clr-bg);color:var(--clr-text);line-height:1.5;min-height:100vh;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit}
a{color:var(--clr-primary);text-decoration:none}
.hidden{display:none!important}
.text-center{text-align:center}.text-muted{color:var(--clr-text-muted)}.text-sm{font-size:.875rem}.text-xs{font-size:.75rem}
.fw-600{font-weight:600}.fw-700{font-weight:700}
.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:1rem}.mt-4{margin-top:1.5rem}
.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:1rem}.mb-4{margin-bottom:1.5rem}
.flex{display:flex}.flex-wrap{flex-wrap:wrap}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-2{gap:.5rem}.gap-3{gap:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.2rem;border:none;border-radius:var(--radius);font-weight:600;font-size:.875rem;cursor:pointer;transition:all var(--transition);white-space:nowrap;text-decoration:none}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn-primary{background:var(--clr-primary);color:#fff}.btn-primary:hover{background:var(--clr-primary-dark)}
.btn-success{background:var(--clr-success);color:#fff}
.btn-danger{background:var(--clr-danger);color:#fff}
.btn-warning{background:var(--clr-warning);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--clr-border);color:var(--clr-text)}
.btn-outline:hover{border-color:var(--clr-primary);color:var(--clr-primary)}
.btn-google{background:#fff;border:1.5px solid var(--clr-border);color:#3c4043;font-weight:600;display:flex;align-items:center;justify-content:center;gap:.6rem}
.btn-google:hover{background:#f8f9fa}
.btn-sm{padding:.4rem .8rem;font-size:.8rem}
.btn-xs{padding:.25rem .5rem;font-size:.75rem;border-radius:var(--radius-sm)}
.btn-block{width:100%}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-weight:600;font-size:.85rem;margin-bottom:.35rem}
.form-control{width:100%;padding:.65rem .85rem;border:1.5px solid var(--clr-border);border-radius:var(--radius);font-size:.9rem;background:var(--clr-surface);color:var(--clr-text)}
.form-control:focus{outline:none;border-color:var(--clr-primary);box-shadow:0 0 0 3px var(--clr-primary-light)}
.form-control::placeholder{color:var(--clr-text-light)}
select.form-control{cursor:pointer}
.card{background:var(--clr-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:1.25rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:.5rem}
.card-title{font-size:1.1rem;font-weight:700}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--clr-surface);border-radius:var(--radius-lg);padding:1rem;box-shadow:var(--shadow);border-left:4px solid var(--clr-primary)}
.stat-card .stat-value{font-size:1.75rem;font-weight:800;line-height:1.2}
.stat-card .stat-label{font-size:.78rem;color:var(--clr-text-muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.stat-card.blue{border-left-color:var(--clr-primary)}
.stat-card.green{border-left-color:var(--clr-success)}
.stat-card.yellow{border-left-color:var(--clr-warning)}
.stat-card.red{border-left-color:var(--clr-danger)}
.stat-card.purple{border-left-color:var(--clr-purple)}
.stat-card.teal{border-left-color:var(--clr-teal)}
.stat-card.orange{border-left-color:var(--clr-orange)}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:var(--radius-full);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge-new{background:var(--clr-primary-light);color:var(--clr-primary)}
.badge-confirmed{background:#cffafe;color:#0e7490}
.badge-picking{background:var(--clr-warning-light);color:#92400e}
.badge-packed{background:var(--clr-purple-light);color:var(--clr-purple)}
.badge-readytoship{background:#d1fae5;color:#065f46}
.badge-shipped{background:#e0e7ff;color:#3730a3}
.badge-outfordelivery{background:#ffedd5;color:#9a3412}
.badge-delivered{background:var(--clr-success-light);color:#166534}
.badge-cancelled{background:var(--clr-danger-light);color:var(--clr-danger)}
.badge-returned{background:#fce7f3;color:#9d174d}
.badge-active{background:var(--clr-success-light);color:#166534}
.badge-inactive{background:var(--clr-danger-light);color:var(--clr-danger)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th,td{padding:.75rem .6rem;text-align:left;border-bottom:1px solid var(--clr-border);white-space:nowrap}
th{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--clr-text-muted);background:#f8fafc}
tr:hover td{background:#f8fafc}
#toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:.5rem;max-width:360px;width:calc(100% - 32px)}
.toast{padding:.75rem 1rem;border-radius:var(--radius);color:#fff;font-weight:600;font-size:.875rem;box-shadow:var(--shadow-lg);animation:toastIn .3s ease;word-break:break-word}
.toast.success{background:var(--clr-success)}.toast.error{background:var(--clr-danger)}.toast.info{background:var(--clr-primary)}.toast.warning{background:var(--clr-warning)}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0;transform:translateX(40px)}}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--clr-surface);border-radius:var(--radius-lg);width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalUp .3s ease}
@keyframes modalUp{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem;border-bottom:1px solid var(--clr-border);position:sticky;top:0;background:var(--clr-surface);z-index:1}
.modal-header h3{font-size:1.1rem}
.modal-close{background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--clr-text-muted);padding:.2rem .5rem;border-radius:var(--radius-sm)}
.modal-body{padding:1.25rem}
.modal-footer{padding:1rem 1.25rem;border-top:1px solid var(--clr-border);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.divider{display:flex;align-items:center;gap:.75rem;margin:1rem 0;color:var(--clr-text-light);font-size:.8rem}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--clr-border)}
.spinner{width:40px;height:40px;border:4px solid var(--clr-border);border-top-color:var(--clr-primary);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--clr-text-muted)}
.empty-state .icon{font-size:3rem;margin-bottom:.5rem}
.app-header{background:var(--clr-surface);border-bottom:1px solid var(--clr-border);position:sticky;top:0;z-index:100;height:var(--header-h);box-shadow:var(--shadow-sm)}
.header-inner{max-width:1280px;margin:0 auto;padding:0 1rem;height:100%;display:flex;align-items:center;gap:1rem}
.logo{font-size:1.2rem;font-weight:800;color:var(--clr-primary);white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.logo span{color:var(--clr-text)}
.header-actions{display:flex;align-items:center;gap:.3rem;margin-left:auto}
.header-btn{background:none;border:none;cursor:pointer;padding:.5rem .6rem;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.7rem;color:var(--clr-text);font-weight:600}
.header-btn:hover{background:var(--clr-bg)}
.header-btn .icon{font-size:1.15rem}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(135deg,#eff6ff 0%,#f1f5f9 100%)}
.login-card{background:var(--clr-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:2rem;width:100%;max-width:400px}
.login-card .logo{justify-content:center;margin-bottom:1.5rem;font-size:1.5rem}
.login-card h2{text-align:center;margin-bottom:.25rem}
.login-card .subtitle{text-align:center;color:var(--clr-text-muted);font-size:.875rem;margin-bottom:1.5rem}
.page-container{max-width:1280px;margin:0 auto;padding:1rem}
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-bar .form-control{width:auto;min-width:150px;flex:1;max-width:280px}
.detail-row{display:flex;justify-content:space-between;padding:.25rem 0;font-size:.875rem}
.detail-row .label{color:var(--clr-text-muted)}
.detail-row .value{font-weight:600;text-align:right}
.order-detail-section{margin-bottom:1.25rem}
.order-detail-section h4{font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--clr-text-muted);margin-bottom:.5rem;border-bottom:1px solid var(--clr-border);padding-bottom:.3rem}
.timeline{position:relative;padding-left:1.5rem}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--clr-border)}
.timeline-item{position:relative;padding-bottom:1rem}
.timeline-item::before{content:'';position:absolute;left:-1.5rem;top:4px;width:10px;height:10px;border-radius:50%;background:var(--clr-primary);border:2px solid var(--clr-surface);box-shadow:0 0 0 2px var(--clr-primary-light)}
.timeline-item .tl-status{font-weight:600;font-size:.85rem}
.timeline-item .tl-date{font-size:.75rem;color:var(--clr-text-muted)}
@media(max-width:767px){.page-container{padding:.75rem}.stats-grid{grid-template-columns:repeat(2,1fr);gap:.6rem}.stat-card .stat-value{font-size:1.3rem}.filter-bar .form-control{max-width:100%;min-width:0}.hidden-mobile{display:none}}
</style>
</head>
<body>

<div id="wms-login" class="login-screen">
  <div class="login-card">
    <div class="logo">🏭 <span>WMS</span></div>
    <h2>Warehouse Login</h2>
    <p class="subtitle">Sign in to manage orders</p>

    <button type="button" class="btn btn-google btn-block" id="wms-google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c2.8 0 5.4 1.1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.6 0-14.2 4.3-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.1 0 9.7-2 13.1-5.1l-6.1-5.2C29.1 34.8 26.7 35.5 24 35.5c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.8 39.2 16.4 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.1 5.2c-.4.4 6.7-4.9 6.7-14.6 0-1.2-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google
    </button>

    <div class="divider">or use email</div>

    <form id="wms-login-form">
      <div class="form-group"><label>Email</label><input type="email" id="wms-email" class="form-control" required></div>
      <div class="form-group"><label>Password</label><input type="password" id="wms-password" class="form-control" required></div>
      <button type="submit" class="btn btn-primary btn-block mt-3" id="wms-login-btn">Sign In</button>
      <p id="wms-login-error" class="text-sm mt-2" style="color:var(--clr-danger)"></p>
    </form>
  </div>
</div>

<div id="wms-panel" class="hidden">
  <header class="app-header">
    <div class="header-inner">
      <div class="logo">🏭 <span>WMS</span></div>
      <div class="header-actions">
        <span id="wms-user-email" class="text-sm text-muted hidden-mobile" style="margin-right:.5rem"></span>
        <button class="header-btn" id="wms-logout-btn"><span class="icon">🚪</span><span>Logout</span></button>
      </div>
    </div>
  </header>

  <main class="page-container">
    <div class="stats-grid">
      <div class="stat-card blue"><div class="stat-value" id="wms-new">0</div><div class="stat-label">New</div></div>
      <div class="stat-card teal"><div class="stat-value" id="wms-confirmed">0</div><div class="stat-label">Confirmed</div></div>
      <div class="stat-card yellow"><div class="stat-value" id="wms-picking">0</div><div class="stat-label">Picking</div></div>
      <div class="stat-card purple"><div class="stat-value" id="wms-packed">0</div><div class="stat-label">Packed</div></div>
      <div class="stat-card green"><div class="stat-value" id="wms-ready">0</div><div class="stat-label">Ready to Ship</div></div>
      <div class="stat-card orange"><div class="stat-value" id="wms-shipped">0</div><div class="stat-label">Shipped</div></div>
      <div class="stat-card blue"><div class="stat-value" id="wms-out">0</div><div class="stat-label">Out for Delivery</div></div>
      <div class="stat-card green"><div class="stat-value" id="wms-delivered">0</div><div class="stat-label">Delivered</div></div>
      <div class="stat-card red"><div class="stat-value" id="wms-cancelled">0</div><div class="stat-label">Cancelled</div></div>
      <div class="stat-card"><div class="stat-value" id="wms-total">0</div><div class="stat-label">Total</div></div>
    </div>

    <div class="card mb-4">
      <div class="filter-bar">
        <input type="text" id="wms-search" class="form-control" placeholder="🔍 Search Order ID, name, mobile, product, SKU...">
        <select id="wms-status-filter" class="form-control">
          <option value="">All Statuses</option>
          <option value="NEW">New</option><option value="CONFIRMED">Confirmed</option>
          <option value="PICKING">Picking</option><option value="PACKED">Packed</option>
          <option value="READY TO SHIP">Ready to Ship</option><option value="SHIPPED">Shipped</option>
          <option value="OUT FOR DELIVERY">Out for Delivery</option><option value="DELIVERED">Delivered</option>
          <option value="CANCELLED">Cancelled</option><option value="RETURNED">Returned</option>
        </select>
        <select id="wms-payment-filter" class="form-control">
          <option value="">All Payments</option>
          <option value="Pending">Pending</option><option value="Paid">Paid</option><option value="Refunded">Refunded</option>
        </select>
        <input type="date" id="wms-date-filter" class="form-control">
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3 class="card-title">📦 Order Management</h3></div>
      <div id="wms-order-list"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<div id="toast-container"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

// ============================================================
// 🔥 YOUR FIREBASE CONFIG (login-ec269)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAYo85hjmMHIUkaALQco2zZvLGNB4qnn6w",
  authDomain: "login-ec269.firebaseapp.com",
  databaseURL: "https://login-ec269-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "login-ec269",
  storageBucket: "login-ec269.firebasestorage.app",
  messagingSenderId: "105803973773",
  appId: "1:105803973773:web:d04142810a7eba2acd4ec4",
  measurementId: "G-DY05C5324Q"
};
// ============================================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

const $ = (s) => document.querySelector(s);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const fmt = (n) => '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const statusBadge = (s) => `<span class="badge badge-${(s || '').toLowerCase().replace(/\s/g, '')}">${s}</span>`;

const STATUS_ACTIONS = {
  'NEW': ['CONFIRMED'], 'CONFIRMED': ['PICKING'], 'PICKING': ['PACKED'],
  'PACKED': ['READY TO SHIP'], 'READY TO SHIP': ['SHIPPED'], 'SHIPPED': ['OUT FOR DELIVERY'],
  'OUT FOR DELIVERY': ['DELIVERED'], 'DELIVERED': [], 'CANCELLED': [], 'RETURNED': []
};
const ACTION_LABELS = {
  'CONFIRMED': 'Confirm Order', 'PICKING': 'Start Picking', 'PACKED': 'Mark Packed',
  'READY TO SHIP': 'Ready to Ship', 'SHIPPED': 'Mark Shipped',
  'OUT FOR DELIVERY': 'Out for Delivery', 'DELIVERED': 'Mark Delivered'
};

let allOrders = [];
let filteredOrders = [];
let unsubOrders = null;
let currentUser = null;

function showToast(msg, type = 'info') {
  const c = $('#toast-container');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.animation = 'toastOut .3s ease forwards'; setTimeout(() => t.remove(), 300); }, 3500);
}

function confirmAction(msg) {
  return new Promise((resolve) => {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay';
    ov.innerHTML = `<div class="modal" style="max-width:400px"><div class="modal-body text-center"><p style="font-weight:600;margin-bottom:1rem">${msg}</p><div style="display:flex;gap:.5rem;justify-content:center"><button class="btn btn-outline" data-a="c">Cancel</button><button class="btn btn-danger" data-a="k">Confirm</button></div></div></div>`;
    ov.querySelector('[data-a="c"]').onclick = () => { ov.remove(); resolve(false); };
    ov.querySelector('[data-a="k"]').onclick = () => { ov.remove(); resolve(true); };
    document.body.appendChild(ov);
  });
}

// ============================================================
// GOOGLE SIGN-IN
// ============================================================
async function signInWithGoogle() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    const userRef = doc(db, 'users', user.uid);
    const userSnap = await getDoc(userRef);
    if (!userSnap.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        email: user.email,
        name: user.displayName || '',
        photoURL: user.photoURL || '',
        role: 'customer',
        createdAt: serverTimestamp()
      });
      showToast('Account created. Admin must grant warehouse role.', 'warning');
      await signOut(auth);
    }
  } catch (err) {
    console.error('Google sign-in error:', err.code, err.message);
    if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') return;
    if (err.code === 'auth/unauthorized-domain') {
      showToast('Domain not authorized. Add this domain in Firebase Console → Auth → Settings → Authorized domains.', 'error');
      return;
    }
    if (err.code === 'auth/operation-not-allowed') {
      showToast('Google sign-in is not enabled. Enable it in Firebase Console → Auth → Sign-in method.', 'error');
      return;
    }
    showToast('Google sign-in failed: ' + err.message, 'error');
  }
}

$('#wms-google-btn').addEventListener('click', signInWithGoogle);

// ============================================================
// EMAIL / PASSWORD
// ============================================================
$('#wms-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#wms-login-error').textContent = '';
  const btn = $('#wms-login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  try {
    await signInWithEmailAndPassword(auth, $('#wms-email').value.trim(), $('#wms-password').value);
  } catch (err) {
    $('#wms-login-error').textContent = err.code === 'auth/invalid-credential' ? 'Invalid credentials.' : err.message;
  } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
});

$('#wms-logout-btn').addEventListener('click', async () => {
  if (await confirmAction('Logout from WMS?')) await signOut(auth);
});

// ============================================================
// AUTH + ROLE CHECK
// ============================================================
onAuthStateChanged(auth, async (user) => {
  if (user) {
    try {
      const uDoc = await getDoc(doc(db, 'users', user.uid));
      const role = uDoc.exists() ? uDoc.data().role : null;
      if (role !== 'warehouse' && role !== 'admin') {
        showToast('Access denied. Warehouse role required.', 'error');
        await signOut(auth);
        return;
      }
    } catch { showToast('Role check failed.', 'error'); await signOut(auth); return; }
    currentUser = user;
    $('#wms-login').classList.add('hidden');
    $('#wms-panel').classList.remove('hidden');
    $('#wms-user-email').textContent = user.email;
    listenOrders();
  } else {
    currentUser = null;
    $('#wms-login').classList.remove('hidden');
    $('#wms-panel').classList.add('hidden');
    if (unsubOrders) { unsubOrders(); unsubOrders = null; }
  }
});

// ============================================================
// ORDERS LISTENER
// ============================================================
function listenOrders() {
  if (unsubOrders) unsubOrders();
  const q = query(collection(db, 'orders'), orderBy('createdAt', 'desc'));
  unsubOrders = onSnapshot(q, (snap) => {
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateStats(); applyFilters();
  }, (err) => {
    showToast('Failed to load orders: ' + err.message, 'error');
  });
}

function updateStats() {
  const c = (s) => allOrders.filter(o => o.orderStatus === s).length;
  $('#wms-new').textContent = c('NEW');
  $('#wms-confirmed').textContent = c('CONFIRMED');
  $('#wms-picking').textContent = c('PICKING');
  $('#wms-packed').textContent = c('PACKED');
  $('#wms-ready').textContent = c('READY TO SHIP');
  $('#wms-shipped').textContent = c('SHIPPED');
  $('#wms-out').textContent = c('OUT FOR DELIVERY');
  $('#wms-delivered').textContent = c('DELIVERED');
  $('#wms-cancelled').textContent = c('CANCELLED') + c('RETURNED');
  $('#wms-total').textContent = allOrders.length;
}

function applyFilters() {
  const s = $('#wms-search').value.toLowerCase();
  const st = $('#wms-status-filter').value;
  const py = $('#wms-payment-filter').value;
  const dt = $('#wms-date-filter').value;
  filteredOrders = allOrders.filter(o => {
    if (st && o.orderStatus !== st) return false;
    if (py && o.paymentStatus !== py) return false;
    if (dt) {
      const d = o.createdAt?.toDate ? o.createdAt.toDate() : null;
      if (!d || d.toISOString().slice(0, 10) !== dt) return false;
    }
    if (s) {
      const hay = [o.orderId, o.customerName, o.mobile, o.email, ...(o.items || []).map(i => i.name), ...(o.items || []).map(i => i.sku)].join(' ').toLowerCase();
      if (!hay.includes(s)) return false;
    }
    return true;
  });
  renderOrderList();
}

$('#wms-search').addEventListener('input', applyFilters);
$('#wms-status-filter').addEventListener('change', applyFilters);
$('#wms-payment-filter').addEventListener('change', applyFilters);
$('#wms-date-filter').addEventListener('change', applyFilters);

function renderOrderList() {
  const el = $('#wms-order-list');
  if (!filteredOrders.length) { el.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No orders match your filters.</p></div>`; return; }
  el.innerHTML = `<div class="table-wrap"><table><thead><tr>
    <th>Order ID</th><th>Customer</th><th>Mobile</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th><th>Action</th>
  </tr></thead><tbody>
    ${filteredOrders.map(o => {
      const items = (o.items || []).map(i => `${esc(i.name)} ×${i.qty}`).join('<br>');
      const d = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString('en-IN') : '—';
      return `<tr>
        <td class="fw-600 text-sm">${esc(o.orderId)}</td>
        <td class="text-sm">${esc(o.customerName)}</td>
        <td class="text-sm">${esc(o.mobile)}</td>
        <td class="text-xs">${items}</td>
        <td class="fw-600">${fmt(o.totalAmount)}</td>
        <td><span class="badge ${o.paymentStatus === 'Paid' ? 'badge-active' : 'badge-inactive'}">${o.paymentStatus || 'Pending'}</span></td>
        <td>${statusBadge(o.orderStatus)}</td>
        <td class="text-xs">${d}</td>
        <td><button class="btn btn-xs btn-primary" onclick="window.openOrderDetail('${o.id}')">View</button></td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}

// ============================================================
// ORDER DETAIL
// ============================================================

  } catch {}

  const actions = STATUS_ACTIONS[o.orderStatus] || [];

    <div class="modal" style="max-width:800px">
      <div class="modal-header"><h3>Order ${esc(o.orderId)}</h3><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button></div>
      <div class="modal-body">

          <div class="order-detail-section">
            <h4>Customer</h4>
            <div class="detail-row"><span class="label">Name</span><span class="value">${esc(o.customerName)}</span></div>
            <div class="detail-row"><span class="label">Mobile</span><span class="value">${esc(o.mobile)}</span></div>
            <div class="detail-row"><span class="label">Email</span><span class="value">${esc(o.email)}</span></div>
            <div class="detail-row"><span class="label">Address</span><span class="value">${esc(o.address)}</span></div>
            <div class="detail-row"><span class="label">City</span><span class="value">${esc(o.city)}</span></div>
            <div class="detail-row"><span class="label">State</span><span class="value">${esc(o.state)}</span></div>
            <div class="detail-row"><span class="label">PIN</span><span class="value">${esc(o.pincode)}</span></div>
            <div class="detail-row"><span class="label">Landmark</span><span class="value">${esc(o.landmark || '—')}</span></div>
          </div>
          <div class="order-detail-section">
            <h4>Order Info</h4>
            <div class="detail-row"><span class="label">Order ID</span><span class="value">${esc(o.orderId)}</span></div>
            <div class="detail-row"><span class="label">Date</span><span class="value">${o.createdAt?.toDate ? o.createdAt.toDate().toLocaleString('en-IN') : '—'}</span></div>
            <div class="detail-row"><span class="label">Payment</span><span class="value">${o.paymentStatus || 'Pending'}</span></div>
            <div class="detail-row"><span class="label">Status</span><span class="value">${statusBadge(o.orderStatus)}</span></div>
          </div>
        </div>
        <div class="order-detail-section mt-3">
          <h4>Products</h4>
          <div class="table-wrap"><table><thead><tr><th>Product</th><th>SKU</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody>
            ${(o.items || []).map(i => `<tr><td>${esc(i.name)}</td><td>${esc(i.sku)}</td><td>${i.qty}</td><td>${fmt(i.price)}</td><td class="fw-600">${fmt(i.price * i.qty)}</td></tr>`).join('')}
          </tbody></table></div>
          <div class="detail-row mt-2"><span class="label">Subtotal</span><span class="value">${fmt(o.subtotal)}</span></div>
          <div class="detail-row"><span class="label">Delivery</span><span class="value">${o.deliveryCharge ? fmt(o.deliveryCharge) : 'FREE'}</span></div>
          <div class="detail-row"><span class="label fw-700">Total</span><span class="value fw-700">${fmt(o.totalAmount)}</span></div>
        </div>
        ${history.length ? `<div class="order-detail-section mt-3"><h4>Status History</h4><div class="timeline">
          ${history.map(h => `<div class="timeline-item"><div class="tl-status">${h.previousStatus ? h.previousStatus + ' → ' : ''}${h.newStatus}</div><div class="tl-date">${h.changedAt?.toDate ? h.changedAt.toDate().toLocaleString('en-IN') : ''} · by ${esc(h.updatedBy || 'system')}</div></div>`).join('')}
        </div></div>` : ''}
        ${actions.length || showCancel ? `<div class="order-detail-section mt-3"><h4>Actions</h4><div class="flex gap-2 flex-wrap">
          ${actions.map(a => `<button class="btn btn-primary btn-sm" onclick="window.updateOrderStatus('${id}','${a}',this)">${ACTION_LABELS[a] || a}</button>`).join('')}
          ${showCancel ? `<button class="btn btn-danger btn-sm" onclick="window.updateOrderStatus('${id}','CANCELLED',this)">Cancel Order</button>` : ''}

// ============================================================
// UPDATE STATUS
// ============================================================
window.updateOrderStatus = async (id, newStatus, btn) => {
  if (!(await confirmAction(`Change status to "${newStatus}"?`))) return;
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const ref = doc(db, 'orders', id);
    const snap = await getDoc(ref);
    if (!snap.exists()) throw new Error('Order not found');
    const prev = snap.data().orderStatus;
    await updateDoc(ref, { orderStatus: newStatus, updatedAt: serverTimestamp() });
    await addDoc(collection(db, 'orderStatusHistory'), {
      orderId: snap.data().orderId, previousStatus: prev, newStatus,
      changedAt: serverTimestamp(),
      updatedBy: currentUser ? (currentUser.email || currentUser.uid) : 'system'
    });
    showToast(`Status → ${newStatus}`, 'success');
    const ov = btn?.closest('.modal-overlay');
    if (ov) ov.remove();
  } catch (err) {
    showToast('Update failed: ' + err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = ACTION_LABELS[newStatus] || newStatus; }
  }
};
